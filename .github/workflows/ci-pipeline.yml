name: Cubix DevOps CI Pipeline

on:
  push:
    branches: [ "master" ]
    # OPCIONÁLIS FELADAT: Csak akkor indul el, ha ezek a fájlok változnak
    paths:
      - 'Dockerfile'
      - 'app.py'
      - '.github/workflows/**'
  pull_request:
    branches: [ "master" ]
    # OPCIONÁLIS FELADAT: Pull Request esetén is érvényesítjük a szűrést
    paths:
      - 'Dockerfile'
      - 'app.py'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t cubix-homework-app:latest .

    - name: Test Docker Container Run
      run: |
        docker run --rm cubix-homework-app:latest
