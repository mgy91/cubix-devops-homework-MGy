name: Cubix DevOps CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t cubix-homework-app:latest .

    - name: Test Docker Container Run
      run: |
        docker run --rm cubix-homework-app:latest

