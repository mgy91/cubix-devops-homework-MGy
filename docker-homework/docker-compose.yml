version: '3.8'

services:
  frontend-node:
    build:
      context: ./app1
      dockerfile: Dockerfile
    image: cubix-frontend-node:v1
    ports:
      - "8081:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - cubix-internal-net

  backend-node:
    build:
      context: ./app2
      dockerfile: Dockerfile
    image: cubix-backend-node:v1
    ports:
      - "8082:3500"
    environment:
      - PORT=3500
      - NODE_ENV=production
    networks:
      - cubix-internal-net
    depends_on:
      - frontend-node

networks:
  cubix-internal-net:
    driver: bridge
